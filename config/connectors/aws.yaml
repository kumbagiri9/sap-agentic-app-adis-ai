# AWS S3 Connector Settings
aws_config:
  access_key_id: "${AWS_ACCESS_KEY_ID}"
  secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
  session_token: "${AWS_SESSION_TOKEN}"
  default_region: "us-east-1"
  s3_buckets:
    - name: "enterprise-sap-s3-1"
      prefix: "historical/2023/"
    - name: "enterprise-sap-s3-2"
      prefix: "design-docs/"
  bedrock_runtime:
    enabled: true
    knowledge_base_id: "SAP_KB_001"
