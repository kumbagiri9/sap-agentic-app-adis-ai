local_knowledge:
  enabled: true
  paths:
    - "C:/sap"
  recursive: true
  supported_file_types:
    - ".pdf"
    - ".docx"
    - ".xlsx"
    - ".csv"
    - ".txt"
    - ".md"
    - ".json"
    - ".xml"
    - ".html"
    - ".pptx"
  exclude_dirs:
    - ".git"
    - "__pycache__"
    - "node_modules"
  max_file_size_mb: 100
